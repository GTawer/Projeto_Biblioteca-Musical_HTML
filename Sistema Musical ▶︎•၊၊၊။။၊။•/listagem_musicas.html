<!DOCTYPE html>
<html lang="pt-pr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem musical</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="page-header-bar">
            <h2>🎼 Biblioteca Musical</h2>
            <div class="header-actions">

                <!-- btn-back volta ao menu e btn-primary leva para o cadastro-->
                <a href="index.html" class="btn-back">
                    ⬅ Voltar ao Menu</a>

                <a href="cadastro_musica.html" class="btn-primary">
                    ➕ Nova Música</a>
            </div>
        </div>
        <!-- Os filtros ficam numa div filters -->
        <div class="filters">

            <form method="get" class="filter-form" action="#">
                <div class="filter-group">
                    <!-- Cada filtro é uma div com o rótulo e o campo -->
                    <div class="filter-item">
                        <label for="busca">Busca geral</label>
                        <input type="text" name="busca" id="busca" placeholder="Título, álbum ou artista…">
                    </div>

                    <div class="filter-item">
                        <label for="artista">Artista</label>
                        <select name="artista" id="artista">
                            <!-- O value vazio quer dizer "todos" -->
                            <option value="">Todos os artistas</option>
                            <!-- O 1 é o código do artista, que o banco vai usar -->
                            <option value="1">Djavan</option>

                        </select>
                    </div>
                </div>
                <div class="filter-item">
                    <label for="genero">Gênero</label>
                    <select name="genero" id="genero">
                        <option value="">Todos os gêneros</option>
                        <option value="MPB">MPB</option>
                    </select>
                </div>

        </div>

        <!-- filter-actions: a área do botão de filtrar. -->
        <div class="filter-actions">
            <button type="submit" class="btn-primary">🔍 Filtrar</button>
        </div>
        </form>

    </div>

    <!-- table-container: a caixa branca com sombra em volta da tabela. -->
    <div class="table-container">
        <table>
            <!-- thead: o cabeçalho da tabela. tr = linha. th = célula de título. -->
            <thead>
                <tr>
                    <!-- As classes col-... deixam o CSS controlar a largura destas colunas. -->
                    <th class="col-capa">Capa</th>
                    <th>Título</th>
                    <th>Artista</th>
                    <th>Álbum</th>
                    <th>Gênero</th>
                    <th class="col-youtube">YouTube</th>
                    <th class="col-acoes">Ações</th>
                </tr>
            </thead>

            <!-- tbody: o corpo. Cada tr é UMA música; cada td é uma informação dela. Os dados estão fixos aqui. Na Sprint 2 o PHP cria estas linhas a partir do banco. -->
            <tbody>
                <tr>
                    <!-- no-image: quadrado "Sem capa" no lugar da imagem (a capa real vem na Sprint 2). -->
                    <td>
                        <div class="no-image">Sem<br>capa</div>
                    </td>
                    <td>Oceano</td>
                    <td>Djavan</td>
                    <td>Luz</td>
                    <td>MPB</td>
                    <!-- target="_blank": abre o vídeo numa aba nova, sem sair do sistema. -->
                    <td><a href="#" target="_blank" class="btn-youtube">▶ Assistir</a></td>
                    <td>
                        <!-- action-buttons: junta Editar e Excluir lado a lado (flex). -->
                        <div class="action-buttons">
                            <a href="#" class="btn-edit">✏️ Editar</a>
                            <a href="#" class="btn-delete">🗑️</a>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="no-image">Sem<br>capa</div>
                    </td>
                    <td>Infinito Particular</td>
                    <td>Marisa Monte</td>
                    <td>—</td> <!-- sem álbum. -->
                    <td>MPB</td>
                    <td><a href="#" target="_blank" class="btn-youtube">▶ Assistir</a></td>
                    <td>
                        <div class="action-buttons">
                            <a href="#" class="btn-edit">✏️ Editar</a>
                            <a href="#" class="btn-delete">️🗑️</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    </div>

</body>


</html>
</body>

</html>
