<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Artista</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="page-header-bar">
        <h2>🎤 Novo Artista</h2>
        <div class="header-actions">
            <a href="index.html" class="btn-back">⬅ Voltar ao Menu</a>
        </div>
    </div>

    <form method="post" action="#" enctype="multipart/form-data">
        <div class="form-grid">
            <!-- os 4 campos entram aqui -->
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">
                ➕ Cadastrar</button>
        </div>

        <div class="form-group">
            <!-- Mensagem vermelha de nome requerido -->
            <label for="nome">Nome do Artista
                <span style="color:var(--red)">*</span></label>
            <input type="text" id="nome" name="nome" required placeholder="Ex: Djavan, Marisa Monte…">
        </div>

        <!-- Caixa de gênero -->
        <div class="form-group">
            <label for="genero">Gênero Musical</label>
            <input type="text" id="genero" name="genero" placeholder="Ex: MPB, Rock, Samba…">
        </div>

        <!-- País: igual, com id="pais" -->
        <div class="form-group">
            <label for="pais">País</label>
            <input type="text" id="pais" name="pais" placeholder="Ex: Brasil, EUA…">
        </div>

        <!-- Inserir imagem do artista -->
        <div class="form-group">
            <label for="imagem">Foto do Artista</label>
            <input type="file" id="imagem" name="imagem" accept="image/*">
            <small>JPG ou PNG · Máximo 5 MB</small>

            <h3>🎸 Artistas Cadastrados</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="col-foto">Foto</th>
                            <th>Nome</th>
                            <th>Gênero</th>
                            <th>País</th>
                            <th class="col-acoes">Ações</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>
                                <div class="no-image">Sem<br>foto</div>
                            </td>
                            <td>Djavan</td>
                            <td>MPB</td>
                            <td>Brasil</td>
                            <td>
                                <div class="action-buttons">
                                    <a href="#" class="btn-edit">✏️ Editar</a>
                                    <a href="#" class="btn-delete">🗑️</a>
                                    <a href="cadastro_musica.html" class="btn-music">🎵 Músicas</a>
                                </div>
                            </td>
</body>

</html>
